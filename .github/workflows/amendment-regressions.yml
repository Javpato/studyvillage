name: Amendment platform regressions
on:
  workflow_dispatch:
    inputs:
      controllers_only:
        description: Repeat only the controller journeys after a verified application baseline
        type: boolean
        default: false
      pets_only:
        description: Verify pet expressions and avatar reset after an artwork adjustment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: ${{ !inputs.controllers_only }}
        run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - if: ${{ !inputs.controllers_only && !inputs.pets_only }}
        run: npm run test:e2e -- pet-rendering.spec.ts pet-expressions.spec.ts pets-controls.spec.ts localization-surfaces.spec.ts amendments.spec.ts board-pencil.spec.ts wardrobe.spec.ts npc-speech.spec.ts
      - if: ${{ !inputs.controllers_only && !inputs.pets_only }}
        run: npm run test:webkit -- pet-expressions.spec.ts pets-controls.spec.ts localization-surfaces.spec.ts amendments.spec.ts board-pencil.spec.ts wardrobe.spec.ts npc-speech.spec.ts
      - if: ${{ inputs.pets_only && !inputs.controllers_only }}
        run: npm run test:e2e -- pet-rendering.spec.ts pet-expressions.spec.ts
      - if: ${{ inputs.pets_only && !inputs.controllers_only }}
        run: npm run test:webkit -- pet-expressions.spec.ts
      - if: ${{ !inputs.pets_only }}
        run: npx playwright test --config app/playwright.controllers.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-${{ matrix.os }}
          path: test-results/
