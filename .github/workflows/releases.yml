name: Build and publish Releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish after all checks pass
        required: true
        type: string
      publish_release:
        description: Publish a Release after verification (disable to audit)
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-release-version.mjs
      - run: npm ci
      - run: npm run check
      - name: Native bridge tests
        run: |
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm run linux:test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:pages
      - name: Complete Chromium regression suite
        run: xvfb-run -a npm run test:e2e
      - name: Phone and starter house in WebKit
        run: npm run test:webkit -- phone-layout.spec.ts initial-house.spec.ts
      - uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: app/dist
          if-no-files-found: error
          retention-days: 3

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux
            os: ubuntu-24.04
          - key: windows
            os: windows-2025
          - key: macos
            os: macos-15
          - key: android
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-web
          path: app/dist
      - name: Build desktop single-file installer
        if: matrix.key != 'android'
        run: node scripts/build-installer.mjs '${{ matrix.key }}'
      - uses: actions/setup-java@v5
        if: matrix.key == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        if: matrix.key == 'android'
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build self-contained Android APK
        if: matrix.key == 'android'
        run: |
          npx cap sync android
          bash android/gradlew -p android assembleDebug
          node scripts/collect-android.mjs
          node scripts/build-installer.mjs android
      - name: Compare packaged web files and native bridge
        run: node scripts/verify-packages.mjs '${{ matrix.key }}'
      - name: Verify actual Linux AppImage payload with sandbox
        if: matrix.key == 'linux'
        run: xvfb-run -a node scripts/test-installer.mjs linux
      - name: Install, test and uninstall the Windows EXE
        if: matrix.key == 'windows'
        run: node scripts/test-installer.mjs windows
      - name: Mount universal DMG and test on Apple Silicon
        if: matrix.key == 'macos'
        run: node scripts/test-installer.mjs macos
      - name: Enable Android emulator hardware acceleration
        if: matrix.key == 'android'
        run: sudo chmod a+rw /dev/kvm
      - name: Install and launch actual APK
        if: matrix.key == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node scripts/test-android.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.key }}
          path: deliverables/release-current/*
          if-no-files-found: error
          retention-days: 3

  test-macos-intel:
    needs: package
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-web
          path: app/dist
      - uses: actions/download-artifact@v8
        with:
          name: package-macos
          path: deliverables/release-current
      - name: Test the identical universal DMG on Intel
        run: node scripts/test-installer.mjs macos
      - uses: actions/upload-artifact@v7
        with:
          name: package-macos-intel-check
          path: deliverables/release-current/INSTALL_CHECK-macos-x64.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [package, test-macos-intel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: deliverables/release-current
          merge-multiple: true
      - name: Require four installers and native verification receipts
        run: node scripts/verify-release.mjs
      - name: Publish four installers with checksums and provenance
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/publish-release.mjs
